services:
  - type: web
    name: trustvault-1ndr
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm --prefix client install --include=dev && npm run build
    startCommand: npm run migrate:pg && npm run seed:pg && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
