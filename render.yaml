services:
  - type: web
    name: trustvault-platform
    env: node
    plan: free
    buildCommand: npm install && npm --prefix client install && npm run build
    startCommand: npx tsx server/src/db/migrate.ts && npx tsx server/src/db/seed.pg.ts && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGINS
        value: https://trustvault-frontend-3scb.onrender.com
