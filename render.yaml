services:
  - type: web
    name: trustvault-platform
    env: node
    plan: free
    buildCommand: npm install && npm --prefix client install && npm --prefix client run build && npm run seed
    startCommand: npx tsx server/src/server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
